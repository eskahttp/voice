# Keys arrive via the LIVEKIT_KEYS env var; Redis is only needed for multi-node.

port: 7880

rtc:
  tcp_port: 7881

  # Must match the ufw rule.
  port_range_start: 50000
  port_range_end: 50100

  # Without the eth0 pin LiveKit advertises Docker bridge IPs as ICE candidates.
  use_external_ip: false
  interfaces:
    includes:
      - eth0
