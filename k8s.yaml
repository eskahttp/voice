apiVersion: v1
kind: Namespace
metadata:
  name: voice
  labels:
    # Needed if the cluster enforces Pod Security "restricted" and
    # you want to use hostNetwork for LiveKit.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: voice
data:
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - ""
    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 50100
      use_external_ip: true
    redis:
      address: 127.0.0.1:6379
    keys:
      # CHANGE THESE
      APIonSvyJtPje3x: hugnmYGTqTcTQLfChoLAglUnfbIjuC8Zrpk92ekCsyXA
    log_level: info
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: voice
type: Opaque
stringData:
  POSTGRES_DB: Voice
  POSTGRES_PASSWORD: root
---
# Fill this with the contents of your .env.docker
apiVersion: v1
kind: Secret
metadata:
  name: nextjs-env
  namespace: voice
type: Opaque
stringData:
  # Example — replace with your actual keys/values from .env.docker
  DATABASE_URL: "postgres://postgres:root@postgres:5432/Voice"
  LIVEKIT_URL: "ws://livekit:7880"
  LIVEKIT_API_KEY: "APIonSvyJtPje3x"
  LIVEKIT_API_SECRET: "hugnmYGTqTcTQLfChoLAglUnfbIjuC8Zrpk92ekCsyXA"
---
############################
# LiveKit + Redis (hostNetwork)
############################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: voice
spec:
  replicas: 1
  selector:
    matchLabels: { app: livekit }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: livekit }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              hostPort: 6379
        - name: livekit
          image: livekit/livekit-server:latest
          args: ["--config", "/etc/livekit.yaml"]
          ports:
            - containerPort: 7880
              hostPort: 7880
            - containerPort: 7881
              hostPort: 7881
          volumeMounts:
            - name: config
              mountPath: /etc/livekit.yaml
              subPath: livekit.yaml
      volumes:
        - name: config
          configMap:
            name: livekit-config
---
# Cluster-internal Service so Next.js can reach LiveKit signaling via DNS
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: voice
spec:
  selector: { app: livekit }
  ports:
    - name: signal
      port: 7880
      targetPort: 7880
---
############################
# Postgres (ephemeral)
############################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: voice
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef: { name: postgres-secret }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: voice
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
############################
# Next.js
############################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs
  namespace: voice
spec:
  replicas: 1
  selector:
    matchLabels: { app: nextjs }
  template:
    metadata:
      labels: { app: nextjs }
    spec:
      containers:
        - name: nextjs
          # REPLACE with your pushed image, e.g. docker.io/youruser/nextjs:latest
          image: docker.io/eskahttp/nextjs-standalone-image:latest
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef: { name: nextjs-env }
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs
  namespace: voice
spec:
  type: NodePort
  selector: { app: nextjs }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300